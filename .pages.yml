media:
  input: static/images
  output: /images

content:
  - name: sps
    label: "CEC сторінки"
    type: collection
    exclude: ["_index.md"]
    path: "content/sps"
    filename: "{slug}.md"
    fields:
      - name: title
        label: "Title"
        type: string
        required: true
      - { name: short_title, label: "Short title", type: string }
      - name: label
        label: "Label"
        type: string
        required: true
      - name: description
        label: "Description"
        type: text
        required: true
      - { name: price_from, label: "Price from", type: string }
      - name: price
        label: "Price"
        type: string
        required: true
      - name: currency
        label: "Currency"
        type: string
        required: true
      - name: efficiency
        label: "Efficiency"
        type: string
        required: true
      - name: rating
        label: "Rating"
        type: string
        required: true
      - { name: attribute_1, label: "Attribute 1", type: string }
      - { name: attribute_2, label: "Attribute 2", type: string }
      - { name: attribute_3, label: "Attribute 3", type: string }
      - name: image
        label: "Main image"
        type: image
        required: true
        description: "Мінімум одне фото обов'язкове"
      - { name: image_alt, label: "Image alt", type: string }
      - {
          name: with_main_image,
          label: "Show Main image on the Page?",
          type: boolean,
          default: true,
        }
      - {
          name: image_left,
          label: "Image left (Fallback/Legacy)?",
          type: boolean,
          default: true,
        }
      - { name: main_button_text, label: "Main button Text", type: text }
      - { name: specs_button_text, label: "Specs button Text", type: text }
      # FEATURES
      - name: features
        label: "Top features"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: "Title", type: string }
          - { name: text, label: "Text", type: text }
          - { name: icon, label: "Icon", type: string }
          - { name: color, label: "Color", type: string }

      # SECTIONS
      - name: sections
        label: "Sections"
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        blockKey: type
        blocks:
          - name: text-with-image
            label: "Text with image"
            fields: # Використовуй fields замість items
              - { name: id, label: "ID", type: string }
              - { name: title, label: "Title", type: string }
              - { name: image, label: "Image", type: image }
              - { name: image_alt, label: "Alt", type: string }

              - name: image_left
                label: "Image on the left?"
                type: boolean
                default: false

              - name: body_text
                label: "Text"
                type: rich-text
              - { name: button_text, label: "Button Text", type: string }

          - name: features-row
            label: "Features row"
            fields:
              - { name: title, label: "Title", type: string }

              - name: steps
                label: "Features"
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: title, label: "Title", type: string }
                  - { name: subtitle, label: "Subtitle", type: string }
                  - { name: text, label: "Text", type: text }

          - name: case-specs
            label: "Case Specs"
            fields:
              - { name: id, label: "ID", type: string }
              - { name: title, label: "Title", type: string }
              - { name: subtitle, label: "SubTitle", type: string }
              - name: specs
                label: "Specs"
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - { name: label, label: "Label", type: string }
                  - { name: value, label: "Value", type: text }
              - { name: image, label: "Image", type: image }
              - { name: image_alt, label: "Image Alt", type: string }
              - {
                  name: image_left,
                  label: "Image on the left?",
                  type: boolean,
                  default: false,
                }
              - { name: button_text, label: "Button Text", type: string }

          - name: system-specs
            label: "System specs"
            fields:
              - { name: title, label: "Title", type: string }
              - { name: button_text, label: "Button", type: string }
              - name: specs
                label: "Specs"
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - { name: label, label: "Label", type: string }
                  - { name: value, label: "Value", type: string }
              - { name: composition_title, label: "Comp Title", type: string }
              - name: composition_list
                label: "Список обладнання"
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{item}"
                fields:
                  - name: item
                    label: Пункт
                    type: text

              - name: installation_label
                label: "Inst Label"
                type: string
              - name: installation_text
                label: "Inst Text"
                type: text

          - name: steps-list
            label: "Steps list"
            fields:
              - { name: title, label: "Title", type: string }
              - name: steps
                label: "Steps"
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: title, label: "Title", type: string }
                  - { name: text, label: "Text", type: text }

          - name: features-grid
            label: "Features grid"
            fields:
              - { name: id, label: "ID", type: string }
              - { name: title, label: "Title", type: string }
              - { name: image, label: "Image", type: image }
              - { name: image_alt, label: "Alt", type: string }
              - name: features
                label: "Features"
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: title, type: string }
                  - { name: subtitle, type: string }
                  - { name: icon, type: string }
                  - { name: bg, type: string }
                  - { name: text, type: string }

          - name: faq
            label: "FAQ"
            fields:
              - { name: title, label: "Title", type: string }
              - name: items # Тут 'items' можна залишити як назву поля, але тип - list
                label: "Questions"
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{question}"
                fields:
                  - { name: question, label: "Q", type: string }
                  - { name: answer, label: "A", type: rich-text }

          - name: full-text-with-button
            label: "Full text CTA"
            fields:
              - { name: id, label: "ID", type: string }
              - { name: title, label: "Title", type: string }
              - { name: content, label: "Content", type: rich-text }
              - { name: button_text, label: "Button", type: string }
          - name: seo-modal
            label: "SEO Modal"
            title: "SEO"
            fields:
              - { name: button_text, label: "Button Text", type: string }
              - { name: seo_text, label: "Text", type: rich-text }
      - { name: SEO_title, label: "SEO title", type: text }
      - { name: SEO_description, label: "SEO description", type: text }
  - name: services
    label: "Послуги"
    type: collection
    exclude: ["_index.md"]
    path: "content/services"
    filename: "{slug}.md"
    fields:
      - { label: "Повний заголовок (H1)", name: "title", type: "string" }
      - { label: "Короткий заголовок", name: "short_title", type: "string" }
      - { label: "Мітка (Label)", name: "label", type: "string" }
      - { label: "SEO Опис", name: "description", type: "text" }
      - { label: "Примітка (Note)", name: "note", type: "string" }
      - { label: "Головне зображення", name: "image", type: "image" }
      - { label: "Alt-текст зображення", name: "image_alt", type: "string" }

      - name: sections
        label: "Sections"
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        blockKey: type
        blocks:
          - name: text-with-image
            label: "Text with image"
            fields: # Використовуй fields замість items
              - { name: title, label: "Title", type: string }
              - { name: image, label: "Image", type: image }
              - { name: image_alt, label: "Alt", type: string }

              - name: image_left
                label: "Image on the left?"
                type: boolean
                default: false

              - name: body_text
                label: "Text"
                type: rich-text

          - name: service-process
            label: "Service Process"
            fields:
              - { name: title, label: "Title", type: string }
              - { name: subtitle, label: "Subtitle", type: string }
              - { name: result_title, label: "Result Title", type: string }
              - {
                  name: result_subtitle,
                  label: "Result Subtitle",
                  type: string,
                }

              - name: steps
                label: "Етапи роботи"
                type: object
                list: true
                fields:
                  - { name: title, label: "Заголовок етапу", type: string }
                  - { name: text, label: "Опис етапу", type: text }

              - name: comparison_negative
                label: "Негативне порівняння"
                type: object
                fields:
                  - { name: label, label: "Мітка (Label)", type: string }
                  - { name: text, label: "Текст", type: text }

              - name: comparison_positive
                label: "Позитивне порівняння (A100)"
                type: object
                fields:
                  - { name: label, label: "Мітка (Label)", type: string }
                  - { name: text, label: "Текст", type: text }

          - name: audit
            label: "Audit / Situations"
            fields:
              - { name: title, label: "Заголовок", type: string }
              - { name: description, label: "Опис", type: text }

              - name: situations
                label: "Сценарії (Situations)"
                type: object
                list: true
                fields:
                  - { name: title, label: "Заголовок сценарію", type: string }
                  - { name: text, label: "Опис сценарію", type: text }

              - {
                  name: checklist_title,
                  label: "Заголовок списку робіт",
                  type: string,
                }

              - name: documentation
                label: "Склад робіт (Checklist)"
                type: object
                list: true

                fields:
                  - { name: item, label: "Пункт робіт", type: text }

              - name: tags
                label: "Переваги (Tags)"
                type: object
                list: true
                fields:
                  - { name: item, label: "Тег", type: string }

              - { name: cta_text, label: "Текст кнопки (CTA)", type: string }

          - name: featured-levels
            label: "Тарифи та формати робіт"
            fields:
              - { name: title, label: "Заголовок секції", type: string }

              - name: tiers
                label: "Варіанти послуг (Tiers)"
                type: object
                list: true
                fields:
                  - {
                      name: label,
                      label: "Мітка (напр. Базовий)",
                      type: string,
                    }
                  - { name: name, label: "Назва формату", type: string }
                  - { name: description, label: "Опис", type: text }
                  - {
                      name: featured,
                      label: "Акцентна картка (True/False)",
                      type: boolean,
                    }
                  - { name: cta, label: "Текст кнопки", type: string }

                  - name: params
                    label: "Технічні деталі (Параметри)"
                    type: object
                    list: true
                    fields:
                      - {
                          name: key,
                          label: "Параметр (напр. Термін)",
                          type: string,
                        }
                      - { name: value, label: "Значення", type: string }

          - name: full-text-with-button
            label: "Full text CTA"
            fields:
              - { name: title, label: "Title", type: string }
              - { name: content, label: "Content", type: rich-text }
              - { name: button_text, label: "Button", type: string }

          - name: faq
            label: "FAQ"
            fields:
              - { name: title, label: "Title", type: string }
              - name: items # Тут 'items' можна залишити як назву поля, але тип - list
                label: "Questions"
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{question}"
                fields:
                  - { name: question, label: "Q", type: string }
                  - { name: answer, label: "A", type: rich-text }
          - name: steps-list
            label: "Список етапів (Steps)"
            fields:
              - { name: title, label: "Заголовок секції", type: string }

              - name: steps
                label: "Кроки процесу"
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - { name: title, label: "Назва кроку", type: string }
                  - { name: text, label: "Опис кроку", type: text }

          - name: seo-modal
            label: "SEO Modal"
            fields:
              - { name: button_text, label: "Button Text", type: string }
              - { name: seo_text, label: "Text", type: rich-text }
      - { name: SEO_title, label: "SEO title", type: text }
      - { name: SEO_description, label: "SEO description", type: text }



  - name: journal
    label: "Блог / Журнал"
    type: collection
    exclude: ["_index.md"]
    path: "content/journal"
    filename: "{slug}/index.md"
    fields:
      - name: title
        label: "Заголовок (Title)"
        type: string
        required: true
      - { label: "Дата публікації", name: "date", type: "datetime" }
      - {
          label: "Чернетка (Draft)",
          name: "draft",
          type: "boolean",
          default: false,
        }
      - {
          label: "Тип (type)",
          name: "type",
          type: "string",
          default: "journal",
        }
      - name: category
        label: "Категорія"
        type: string
        required: true
      - name: editorial_type
        label: "Тип редакційного матеріалу"
        type: string
        required: true
      - name: reading_time
        label: "Час читання"
        type: string
        required: true
      - name: description
        label: "Опис (Description)"
        type: text
        required: true
      - name: image
        label: "Головне зображення"
        type: image
        required: true
        description: "Мінімум одне фото обов'язкове"
      - { label: "Alt-текст зображення", name: "image_alt", type: "string" }
      - {
          label: "Автор",
          name: "author",
          type: "string",
          default: "Редакція А100",
        }

  

  - name: calculator_basic
    label: "Калькулятор — таблиця basic"
    description: "Базова таблиця конфігурацій станцій для розрахунку вартості."
    path: themes/sun-power-theme-v1/static/data/calculator/basic.json
    type: file
    format: json
    fields:
      - name: basic
        label: "Записи (рядки таблиці)"
        type: object
        list:
          min: 36
          max: 36
          collapsible:
            collapsed: true
            summary: "{тип_станції} · {тип_мережі_фаз}ф · {потужність_квт} кВт"
        fields:
          # ── Ідентифікаційні поля (ключ запису, не редагувати) ─────
          - name: "потужність_квт"
            label: "🔒 Потужність, кВт"
            description: "Ідентифікаційне поле. Разом із фазами та типом станції утворює унікальний ключ — не редагувати після створення."
            type: number
            required: true
            readonly: true
            options:
              readonly: true

          - name: "тип_мережі_фаз"
            label: "🔒 Тип мережі, фаз"
            description: "Ідентифікаційне поле. He редагувати після створення."
            type: select
            required: true
            readonly: true
            options:
              readonly: true
              values:
                - { value: 1, label: "1 фаза" }
                - { value: 3, label: "3 фази" }

          - name: "тип_станції"
            label: "🔒 Тип станції"
            description: "Ідентифікаційне поле. He редагувати після створення."
            type: select
            required: true
            readonly: true
            options:
              readonly: true
              values:
                - { value: "hybrid", label: "гібридна" }
                - { value: "grid", label: "мережева" }

          # ── Інвертор ──────────────────────────────────────────────
          - name: "мін_ціна_інв_usd"
            label: "Мін. ціна інвертора, $"
            type: number

          - name: "напруга_на_стринг"
            label: "Напруга на стринг, B"
            type: number

          # ── Панелі (рекомендована конфігурація) ───────────────────
          - name: "панелей_рек"
            label: "Панелей, рек"
            type: number

          - name: "стрингів_рек"
            label: "Стрингів, рек"
            type: number

          - name: "pv_потужність_рек"
            label: "PV потужність, рек, кВт"
            type: number

          # ── Панелі (мінімальна конфігурація) ──────────────────────
          - name: "мінімум_панелей_шт"
            label: "Мінімум панелей, шт"
            type: number

          - name: "стрингів_мін"
            label: "Стрингів, мін"
            type: number

          - name: "pv_потужність_мін"
            label: "PV потужність, мін, кВт"
            type: number

          # ── Ціни панелей та кріплень ──────────────────────────────
          - name: "ціна_панелей_рек"
            label: "Ціна панелей, рек, $"
            type: number

          - name: "ціна_панелей_мін"
            label: "Ціна панелей, мін, $"
            type: number

          - name: "ціна_кріплення_рек"
            label: "Ціна кріплень, рек, $"
            type: number

          - name: "ціна_кріплення_мін"
            label: "Ціна кріплень, мін, $"
            type: number

          # ── АКБ ───────────────────────────────────────────────────
          - name: "акб_конфігурація"
            label: "АКБ, конфігурація"
            type: select
            options:
              creatable: true
              values:
                - "без акб"
                - "A100_5"
                - "A100_16"
                - "Deye_HV_5_BMS_30"
                - "Deye_HV_5_BMS_50"

          - name: "корисна_ємність_квт"
            label: "Корисна ємність, кВт·год"
            type: number

          - name: "акб_кількість"
            label: "АКБ, кількість"
            type: number

          - name: "акб_ціна"
            label: "АКБ, ціна, $"
            type: number

          # ── Кабель AC ─────────────────────────────────────────────
          - name: "кабель_ac"
            label: "Кабель AC, переріз"
            type: select
            options:
              creatable: true
              values:
                - "4x4"
                - "4x6"
                - "4x10"
                - "1x16"
                - "1x25"
                - "1x35"
                - "1x50"
                - "1x90"

          - name: "кабель_ac_довжина_м"
            label: "Кабель AC, довжина, м"
            type: number

          - name: "кабель_ac_ціна"
            label: "Кабель AC, ціна, $"
            type: number

          # ── Кабель DC ─────────────────────────────────────────────
          - name: "кабель_dc"
            label: "Кабель DC, тип"
            type: string
            default: "DC"

          - name: "кабель_dc_довжина_рек_м"
            label: "Кабель DC, довжина, рек, м"
            type: number

          - name: "кабель_dc_довжина_мін_м"
            label: "Кабель DC, довжина, мін, м"
            type: number

          - name: "кабель_dc_ціна_рек"
            label: "Кабель DC, ціна, рек, $"
            type: number

          - name: "кабель_dc_ціна_мін"
            label: "Кабель DC, ціна, мін, $"
            type: number

          # ── Захист AC ─────────────────────────────────────────────
          - name: "захист_ac"
            label: "Захист та комутація AC"
            type: select
            options:
              creatable: true
              values:
                - "AC 1Ф до 12 квт"
                - "AC 1Ф до 20 квт"
                - "AC 3Ф до 12 квт"
                - "AC 3Ф до 60 квт"
                - "AC 3Ф до 120 квт"
                - "AC 3Ф до 200 квт"
                - "AC 3Ф до 350 квт"

          - name: "захист_ac_ціна"
            label: "Захист AC, ціна, $"
            type: number

          # ── Захист DC ─────────────────────────────────────────────
          - name: "захист_dc"
            label: "Захист та комутація DC"
            type: string
            default: "DC"

          - name: "захист_dc_ціна_рек"
            label: "Захист DC, ціна, рек, $"
            type: number

          - name: "захист_dc_ціна_мін"
            label: "Захист DC, ціна, мін, $"
            type: number

          # ── Робота (монтаж) ───────────────────────────────────────
          - name: "робота_інвертор"
            label: "Робота, інвертор, $"
            type: number

          - name: "робота_панель_рек_плоска"
            label: "Робота, панель, рек, плоска криша, $"
            type: number

          - name: "робота_панель_мін_плоска"
            label: "Робота, панель, мін, плоска криша, $"
            type: number

          # ── Підсумкові ціни ───────────────────────────────────────
          - name: "ціна_без_сонця"
            label: "Ціна без сонця, $"
            type: number

          - name: "ціна_комплекта_рек"
            label: "Ціна комплекта, рек, $"
            type: number

          - name: "ціна_комплекта_баз"
            label: "Ціна комплекта, баз, $"
            type: number

  - name: home
    label: "Головна сторінка"
    type: file
    path: "content/_index.md"
    fields:
      - { label: "SEO Title", name: "title", type: "string" }
      - name: sections
        label: "Конструктор сторінки"
        type: block
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        blockKey: type
        blocks:
          # --- HERO SECTION ---
          - name: hero
            label: "Hero блок"
            fields:
              - { name: title, label: "Title", type: string }
