media:
  input: static/images
  output: /images

content:
  
  - name: sps
    label: "CEC сторінки"
    type: collection
    path: "content/sps"
    filename: "{slug}.md"
    fields:
      - { name: title, label: "Title", type: string }
      - { name: short_title, label: "Short title", type: string }
      - { name: label, label: "Label", type: string }
      - { name: description, label: "Description", type: text }
      - { name: price_from, label: "Price from", type: string }
      - { name: price, label: "Price", type: string }
      - { name: currency, label: "Currency", type: string }
      - { name: efficiency, label: "Efficiency", type: string }
      - { name: rating, label: "Rating", type: string }
      - { name: attribute_1, label: "Attribute 1", type: string }
      - { name: attribute_2, label: "Attribute 2", type: string }
      - { name: attribute_3, label: "Attribute 3", type: string }
      - { name: layout, label: "Layout", type: string, default: "sps" }
      - { name: image, label: "Main image", type: image }
      - { name: image_alt, label: "Image alt", type: string }
      - { name: with_main_image, label: "Show Main image on the Page?", type: boolean, default: true }
      - { name: image_left, label: "Image left (Fallback/Legacy)?", type: boolean, default: true }
      - { name: main_button_text, label: "Main button Text", type: text }
      - { name: specs_button_text, label: "Specs button Text", type: text }
      # FEATURES
      - name: features
        label: "Top features"
        type: object
        list:
          collapsible:
              collapsed: true
              summary: "{title}"
        fields:
          - { name: title, label: "Title", type: string }
          - { name: text, label: "Text", type: text }
          - { name: icon, label: "Icon", type: string }
          - { name: color, label: "Color", type: string }

      # SECTIONS
      - name: sections
        label: "Sections"
        type: block
        list:
          collapsible:
              collapsed: true
              summary: "{title}"
        blockKey: type
        blocks: 
          - name: text-with-image
            label: "Text with image"
            fields: # Використовуй fields замість items
              - { name: id, label: "ID", type: string }
              - { name: title, label: "Title", type: string }
              - { name: image, label: "Image", type: image }
              - { name: image_alt, label: "Alt", type: string }

              - name: image_left
                label: "Image on the left?"
                type: boolean
                default: false
             
              - name: body_text
                label: "Text"
                type: rich-text
              - { name: button_text, label: "Button Text", type: string }

          - name: features-row
            label: "Features row"
            fields:
              - { name: title, label: "Title", type: string }
             
              - name: steps
                label: "Features"
                type: object
                list: true
                fields:
                  - { name: title, label: "Title", type: string }
                  - { name: subtitle, label: "Subtitle", type: string }
                  - { name: text, label: "Text", type: text }
           
          - name: case-specs
            label: "Case Specs"
            fields:
              - { name: id, label: "ID", type: string }
              - { name: title, label: "Title", type: string }
              - { name: subtitle, label: "SubTitle", type: string }
              - name: specs
                label: "Specs"
                type: object
                list: true
                fields:
                   - { name: label, label: "Label", type: string }
                   - { name: value, label: "Value", type: text }
              - { name: image, label: "Image", type: image }
              - { name: image_alt, label: "Image Alt", type: string }
              - { name: image_left, label: "Image on the left?", type: boolean, default: false }
              - { name: button_text, label: "Button Text", type: string }
              
          - name: system-specs
            label: "System specs"
            fields:
              - { name: title, label: "Title", type: string }
              - { name: button_text, label: "Button", type: string }
              - name: specs
                label: "Specs"
                type: object
                list: true
                fields:
                  - { name: label, label: "Label", type: string }
                  - { name: value, label: "Value", type: string }
              - { name: composition_title, label: "Comp Title", type: string }
              - name: composition_list
                label: "Список обладнання"
                type: object
                list: true
                fields:
                  - name: item
                    label: Пункт
                    type: text
                
              - name: installation_label 
                label: "Inst Label"
                type: string
              - name: installation_text
                label: "Inst Text"
                type: text


          - name: steps-list
            label: "Steps list"
            fields:
              - { name: title, label: "Title", type: string }
              - name: steps
                label: "Steps"
                type: object
                list: true
                fields:
                  - { name: title, label: "Title", type: string }
                  - { name: text, label: "Text", type: text }

          - name: features-grid
            label: "Features grid"
            fields:
              - { name: id, label: "ID", type: string }
              - { name: title, label: "Title", type: string }
              - { name: image, label: "Image", type: image }
              - { name: image_alt, label: "Alt", type: string }
              - name: features
                label: "Features"
                type: object
                list: true
                fields:
                  - { name: title, type: string }
                  - { name: subtitle, type: string }
                  - { name: icon, type: string }
                  - { name: bg, type: string }
                  - { name: text, type: string }

          - name: faq
            label: "FAQ"
            fields:
              - { name: title, label: "Title", type: string }
              - name: items # Тут 'items' можна залишити як назву поля, але тип - list
                label: "Questions"
                type: object
                list: true
                fields:
                  - { name: question, label: "Q", type: string }
                  - { name: answer, label: "A", type: rich-text }

          - name: full-text-with-button
            label: "Full text CTA"
            fields:
              - { name: id, label: "ID", type: string }
              - { name: title, label: "Title", type: string }
              - { name: content, label: "Content", type: rich-text }
              - { name: button_text, label: "Button", type: string }
          - name: seo-modal
            label: "SEO Modal"
            title: "SEO"
            fields:
              - { name: button_text, label: "Button Text", type: string }
              - { name: seo_text, label: "Text", type: rich-text }
      - { name: SEO_title, label: "SEO title", type: text }
      - { name: SEO_description, label: "SEO description", type: text }
  - name: services
    label: "Послуги"
    type: collection
    path: "content/services"
    filename: "{slug}.md"
    fields:
      - { label: "Повний заголовок (H1)", name: "title", type: "string" }
      - { label: "Короткий заголовок", name: "short_title", type: "string" }
      - { label: "Мітка (Label)", name: "label", type: "string" }
      - { label: "SEO Опис", name: "description", type: "text" }
      - { label: "Примітка (Note)", name: "note", type: "string" }
      - { label: "Головне зображення", name: "image", type: "image" }
      - { label: "Alt-текст зображення", name: "image_alt", type: "string" }
      
      - name: sections
        label: "Sections"
        type: block
        list:
          collapsible:
              collapsed: true
              summary: "{title}"
        blockKey: type
        blocks: 
          - name: text-with-image
            label: "Text with image"
            fields: # Використовуй fields замість items
              - { name: title, label: "Title", type: string }
              - { name: image, label: "Image", type: image }
              - { name: image_alt, label: "Alt", type: string }

              - name: image_left
                label: "Image on the left?"
                type: boolean
                default: false
             
              - name: body_text
                label: "Text"
                type: rich-text
                
          - name: service-process
            label: "Service Process"
            fields:
              - { name: title, label: "Title", type: string }
              - { name: subtitle, label: "Subtitle", type: string }
              - { name: result_title, label: "Result Title", type: string }
              - { name: result_subtitle, label: "Result Subtitle", type: string }
              
              - name: steps
                label: "Етапи роботи"
                type: object
                list: true
                fields:
                  - { name: title, label: "Заголовок етапу", type: string }
                  - { name: text, label: "Опис етапу", type: text }

              - name: comparison_negative
                label: "Негативне порівняння"
                type: object
                fields:
                  - { name: label, label: "Мітка (Label)", type: string }
                  - { name: text, label: "Текст", type: text }

              - name: comparison_positive
                label: "Позитивне порівняння (A100)"
                type: object
                fields:
                  - { name: label, label: "Мітка (Label)", type: string }
                  - { name: text, label: "Текст", type: text }
                  
          - name: audit
            label: "Audit / Situations"
            fields:
              - { name: title, label: "Заголовок", type: string }
              - { name: description, label: "Опис", type: text }
              
              - name: situations
                label: "Сценарії (Situations)"
                type: object
                list: true
                fields:
                  - { name: title, label: "Заголовок сценарію", type: string }
                  - { name: text, label: "Опис сценарію", type: text }

              - { name: checklist_title, label: "Заголовок списку робіт", type: string }
              
              - name: documentation
                label: "Склад робіт (Checklist)"
                type: object
                list: true
                
                fields:
                  - { name: item, label: "Пункт робіт", type: text }

              - name: tags
                label: "Переваги (Tags)"
                type: object
                list: true
                fields:
                  - { name: item, label: "Тег", type: string }

              - { name: cta_text, label: "Текст кнопки (CTA)", type: string }

          - name: featured-levels
            label: "Тарифи та формати робіт"
            fields:
              - { name: title, label: "Заголовок секції", type: string }
              
              - name: tiers
                label: "Варіанти послуг (Tiers)"
                type: object
                list: true
                fields:
                  - { name: label, label: "Мітка (напр. Базовий)", type: string }
                  - { name: name, label: "Назва формату", type: string }
                  - { name: description, label: "Опис", type: text }
                  - { name: featured, label: "Акцентна картка (True/False)", type: boolean }
                  - { name: cta, label: "Текст кнопки", type: string }
                  
                  - name: params
                    label: "Технічні деталі (Параметри)"
                    type: object
                    list: true
                    fields:
                      - { name: key, label: "Параметр (напр. Термін)", type: string }
                      - { name: value, label: "Значення", type: string }
                      
          - name: full-text-with-button
            label: "Full text CTA"
            fields:
              - { name: title, label: "Title", type: string }
              - { name: content, label: "Content", type: rich-text }
              - { name: button_text, label: "Button", type: string }

          - name: faq
            label: "FAQ"
            fields:
              - { name: title, label: "Title", type: string }
              - name: items # Тут 'items' можна залишити як назву поля, але тип - list
                label: "Questions"
                type: object
                list: true
                fields:
                  - { name: question, label: "Q", type: string }
                  - { name: answer, label: "A", type: rich-text }
          - name: steps-list
            label: "Список етапів (Steps)"
            fields:
              - { name: title, label: "Заголовок секції", type: string }
              
              - name: steps
                label: "Кроки процесу"
                type: object
                list: true
                fields:
                  - { name: title, label: "Назва кроку", type: string }
                  - { name: text, label: "Опис кроку", type: text }

          - name: seo-modal
            label: "SEO Modal"
            fields:
              - { name: button_text, label: "Button Text", type: string }
              - { name: seo_text, label: "Text", type: rich-text }
      - { name: SEO_title, label: "SEO title", type: text }
      - { name: SEO_description, label: "SEO description", type: text }
      
  - name: projects
    label: "Наші роботи"
    type: collection
    path: "content/projects"
    filename: "{slug}.md"
    fields:
      - { label: "Шаблон (layout)", name: "layout", type: "string", default: "projects" }
      - { label: "Назва проєкту (H1)", name: "title", type: "string" }
      - { label: "Коротка назва", name: "short_title", type: "string" }
      - { label: "Мітка потужності", name: "power_label", type: "string" }
      - { label: "Категорія", name: "category", type: "string" }
      - { label: "Локація", name: "location", type: "string" }
      - { label: "Головне фото", name: "image", type: "image" }
      - label: "Галерея зображень (images)"
        name: "images"
        type: list
        field: { label: "Зображення", type: image }
      - { label: "Посилання", name: "link", type: "string" }
    
      # Блок статистики (3 головні картки)
      - label: "Головна статистика (stats)"
        name: "stats"
        type: object
        list:
          collapsible:
              collapsed: true
              summary: "{label}"
        fields:
          - { label: "Заголовок", name: "label", type: "string" }
          - { label: "Значення", name: "value", type: "string" }
          - { label: "Опис (підтекст)", name: "subtext", type: "string" }
          - { label: "Іконка (напр. battery, sun)", name: "icon", type: "string" }
    
      # Блок Задача / Результат
      - label: "Місія проєкту (Mission)"
        name: "mission"
        type: object
        fields:
          - { label: "Задача", name: "task", type: "text" }
          - { label: "Результат", name: "result", type: "text" }
          - { label: "Рішення (solution)", name: "solution", type: "text" }
          - label: "Додаткові специфікації результату (results_specs)"
            name: "results_specs"
            type: object
            list: true
            fields:
              - { label: "Ключ", name: "key", type: "string" }
              - { label: "Значення", name: "val", type: "string" }
    
      # Таблиця параметрів
      # Таблиця параметрів
      - label: "Таблиця параметрів (parameters)"
        name: "parameters"
        type: object
        list:
          collapsible:
              collapsed: true
              summary: "{key}"
        fields:
          - { label: "Ключ (Параметр)", name: "key", type: "string" }
          - { label: "Значення", name: "val", type: "string" }

      # Додаткові параметри
      - label: "Додаткові параметри"
        name: "parameters_else"
        type: object
        list:
          collapsible:
              collapsed: true
              summary: "{key}"
        fields:
          - { label: "Ключ (Параметр)", name: "key", type: "string" }
          - { label: "Значення", name: "val", type: "string" }
    
      # Склад системи
      - label: "Склад системи (components)"
        name: "components"
        type: object
        list:
          collapsible:
              collapsed: true
              summary: "{name}"
        fields:
          - { label: "Назва пристрою", name: "name", type: "string" }
          - { label: "Опис/Характеристики", name: "desc", type: "string" }
          - { label: "Кількість", name: "qty", type: "string" }
    
      # Відгук клієнта
      - label: "Відгук (Testimonial)"
        name: "testimonial"
        type: object
        fields:
          - { label: "Текст відгуку", name: "text", type: "text" }
          - { label: "Автор", name: "author", type: "string" }
          - { label: "Посада/Роль", name: "role", type: "string" }
          - { label: "Ініціали", name: "initials", type: "string" }
          - { label: "Рейтинг (зірки)", name: "rating", type: "number" }

  - name: journal
    label: "Блог / Журнал"
    type: collection
    path: "content/journal"
    filename: "{slug}/index.md"
    fields:
      - { label: "Заголовок (Title)", name: "title", type: "string" }
      - { label: "Дата публікації", name: "date", type: "datetime" }
      - { label: "Чернетка (Draft)", name: "draft", type: "boolean", default: false }
      - { label: "Шаблон (layout)", name: "layout", type: "string", default: "single" }
      - { label: "Тип (type)", name: "type", type: "string", default: "journal" }
      - { label: "Категорія", name: "category", type: "string" }
      - { label: "Тип редакційного матеріалу", name: "editorial_type", type: "string" }
      - { label: "Час читання", name: "reading_time", type: "string" }
      - { label: "Опис (Description)", name: "description", type: "text" }
      - { label: "Головне зображення", name: "image", type: "image" }
      - { label: "Alt-текст зображення", name: "image_alt", type: "string" }
      - { label: "Автор", name: "author", type: "string", default: "Редакція А100" }

  - name: products
    label: "Товари / Каталог"
    type: collection
    path: "content/products"
    filename: "{folder}/{slug}.md"
    fields:
      - { label: "Заголовок (Title)", name: "title", type: "string" }
      - { label: "Короткий опис", name: "description", type: "string" }
      - { label: "Шаблон (layout)", name: "layout", type: "string", default: "single" }
      - name: category
        label: "Категорія"
        type: select
        options:
          - { label: "A100", value: "A100" }
          - { label: "Аксесуари", value: "Аксесуари" }
          - { label: "Акумулятори", value: "Акумулятори" }
          - { label: "Інвертори", value: "Інвертори" }
          - { label: "Готові комплекти", value: "Готові комплекти" }
          - { label: "Сонячні панелі", value: "Сонячні панелі" }
          - { label: "Комплектуючі", value: "Комплектуючі" }
      - { label: "Ціна", name: "price", type: "string" }
      - label: "Галерея зображень (images)"
        name: "images"
        type: list
        field: { label: "Зображення", type: image }
      - { label: "Повний опис", name: "full_description", type: "text" }
      - label: "Характеристики (specs)"
        name: "specs"
        type: object
        list: true
        fields:
          - { label: "Параметр", name: "key", type: "string" }
          - { label: "Значення", name: "val", type: "string" }

  
  - name: calculator_basic
    label: "Калькулятор — таблиця basic"
    description: "Базова таблиця конфігурацій станцій для розрахунку вартості."
    path: themes/sun-power-theme-v1/static/data/calculator/basic.json
    type: file
    format: json
    fields:
      - name: basic
        label: "Записи (рядки таблиці)"
        type: object
        list:
          min: 36
          max: 36
          collapsible:
            collapsed: true
            summary: "{station_type} · {network_phase}ф · {power_kwt} кВт"
        fields:
          # ── Ідентифікаційні поля (ключ запису, не редагувати) ─────
          - name: "power_kwt"
            label: "🔒 Потужність, кВт"
            description: "Ідентифікаційне поле. Разом із фазами та типом станції утворює унікальний ключ — не редагувати після створення."
            type: number
            required: true
            readonly: true
            options:
              readonly: true

          - name: "network_phase"
            label: "🔒 Тип мережі, фаз"
            description: "Ідентифікаційне поле. He редагувати після створення."
            type: select
            required: true
            readonly: true
            options:
              readonly: true
              values:
                - { value: 1, label: "1 фаза" }
                - { value: 3, label: "3 фази" }

          - name: "station_type"
            label: "🔒 Тип станції"
            description: "Ідентифікаційне поле. He редагувати після створення."
            type: select
            required: true
            readonly: true
            options:
              readonly: true
              values:
                - { value: "hybrid", label: "гібридна" }
                - { value: "grid", label: "мережева" }

          # ── Інвертор ──────────────────────────────────────────────
          - name: "min_price_inverter_usd"
            label: "Мін. ціна інвертора, $"
            type: number

          - name: "string_voltage"
            label: "Напруга на стринг, B"
            type: number

          # ── Панелі (рекомендована конфігурація) ───────────────────
          - name: "panels_rec_qty"
            label: "Панелей, рек"
            type: number

          - name: "strings_rec_qty"
            label: "Стрингів, рек"
            type: number

          - name: "pv_power_rec"
            label: "PV потужність, рек, кВт"
            type: number

          # ── Панелі (мінімальна конфігурація) ──────────────────────
          - name: "panels_min_qty"
            label: "Мінімум панелей, шт"
            type: number

          - name: "strings_min_qty"
            label: "Стрингів, мін"
            type: number

          - name: "pv_power_min"
            label: "PV потужність, мін, кВт"
            type: number

          # ── Ціни панелей та кріплень ──────────────────────────────
          - name: "price_panels_rec"
            label: "Ціна панелей, рек, $"
            type: number

          - name: "price_panels_min"
            label: "Ціна панелей, мін, $"
            type: number

          - name: "price_mounts_rec"
            label: "Ціна кріплень, рек, $"
            type: number

          - name: "price_mounts_min"
            label: "Ціна кріплень, мін, $"
            type: number

          # ── АКБ ───────────────────────────────────────────────────
          - name: "battery_config"
            label: "АКБ, конфігурація"
            type: select
            options:
              creatable: true
              values:
                - "без акб"
                - "A100_5"
                - "A100_16"
                - "Deye_HV_5_BMS_30"
                - "Deye_HV_5_BMS_50"

          - name: "usable_capacity_kwt"
            label: "Корисна ємність, кВт·год"
            type: number

          - name: "battery_qty"
            label: "АКБ, кількість"
            type: number

          - name: "battery_price"
            label: "АКБ, ціна, $"
            type: number

          # ── Кабель AC ─────────────────────────────────────────────
